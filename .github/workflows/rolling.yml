name: Publish rolling main manifests

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: rolling-main-publication
  cancel-in-progress: false

jobs:
  publish-ledger:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ledger_sha: ${{ steps.ledger-state.outputs.ledger_sha }}
    steps:
      - name: Checkout the exact green CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate is still in main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          candidate="${{ github.event.workflow_run.head_sha }}"
          git cat-file -e "$candidate^{commit}"
          git merge-base --is-ancestor "$candidate" origin/main
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check exact checkout version contract
        run: node tools/version/check-versions.mjs
      - name: Resolve product and installer version contract
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          contract="$RUNNER_TEMP/harmonia-versions.json"
          node tools/version/check-versions.mjs --json > "$contract"
          application_version="$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).productVersion);' "$contract")"
          installer_version="$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).installerVersion);' "$contract")"
          minimum_installer_version="$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).minimumInstallerVersion);' "$contract")"
          echo "application_version=$application_version" >> "$GITHUB_OUTPUT"
          echo "installer_version=$installer_version" >> "$GITHUB_OUTPUT"
          echo "minimum_installer_version=$minimum_installer_version" >> "$GITHUB_OUTPUT"
      - name: Prepare rolling history checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" rolling-site
          else
            mkdir rolling-site
            git -C rolling-site init
            git -C rolling-site checkout --orphan gh-pages
            git -C rolling-site remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git -C rolling-site config user.name github-actions[bot]
            git -C rolling-site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          fi
      - name: Evaluate monotonic rolling policy
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ github.event.workflow_run.head_sha }}"
          latest=$(node tools/release/publish-rolling.mjs latest --root rolling-site)
          echo "latest_sha=$latest" >> "$GITHUB_OUTPUT"
          action=$(node tools/release/rolling-policy.mjs --candidate "$candidate" --latest "$latest")
          echo "action=$action" >> "$GITHUB_OUTPUT"
          if [[ "$action" == "noop" ]]; then
            echo "late completion for ancestor $candidate; latest published commit is $latest"
          fi
      - name: Allocate durable generation
        id: generation
        if: steps.policy.outputs.action == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          generation=$(node tools/release/publish-rolling.mjs allocate --root rolling-site --sha "${{ github.event.workflow_run.head_sha }}" --expected-latest-sha "${{ steps.policy.outputs.latest_sha }}")
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
      - name: Create and sign manifests
        shell: bash
        if: steps.policy.outputs.action == 'publish'
        env:
          MANIFEST_KEY: ${{ secrets.HARMONIA_MANIFEST_SIGNING_KEY_PEM }}
          PUBLIC_KEY: ${{ secrets.HARMONIA_MANIFEST_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          test -n "$MANIFEST_KEY" || { echo "rolling Ed25519 signing key is not configured" >&2; exit 1; }
          test "$PUBLIC_KEY" = "5e02dfc689bc3c447cffa720d94225b5bedb593cb4f77c5ba0461103705363d2" || { echo "production public key secret does not match installer trust root" >&2; exit 1; }
          key="$RUNNER_TEMP/harmonia-manifest-key.pem"
          printf '%s\n' "$MANIFEST_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          sha="${{ github.event.workflow_run.head_sha }}"
          for platform in linux windows; do
            node tools/release/create-manifest.mjs --platform "$platform" --target-commit "$sha" --product-version "${{ steps.versions.outputs.application_version }}" --min-installer-version "${{ steps.versions.outputs.minimum_installer_version }}" --generation "${{ steps.generation.outputs.generation }}" --out "$RUNNER_TEMP/manifest-$platform.json"
            HARMONIA_MANIFEST_SIGNING_KEY_FILE="$key" node tools/release/sign-manifest.mjs "$RUNNER_TEMP/manifest-$platform.json" "$RUNNER_TEMP/manifest-$platform.json.sig" primary-2026-09
            cargo run --quiet --manifest-path apps/installer/Cargo.toml --bin harmonia-manifest-verify -- "$platform" "$RUNNER_TEMP/manifest-$platform.json" "$RUNNER_TEMP/manifest-$platform.json.sig"
          done
      - name: Publish immutable history and stable aliases
        shell: bash
        if: steps.policy.outputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${{ github.event.workflow_run.head_sha }}" origin/main
          sha="${{ github.event.workflow_run.head_sha }}"
          node tools/release/publish-rolling.mjs publish --root rolling-site --sha "$sha" --generation "${{ steps.generation.outputs.generation }}" --expected-latest-sha "${{ steps.policy.outputs.latest_sha }}" \
            --linux-manifest "$RUNNER_TEMP/manifest-linux.json" --linux-signature "$RUNNER_TEMP/manifest-linux.json.sig" \
            --windows-manifest "$RUNNER_TEMP/manifest-windows.json" --windows-signature "$RUNNER_TEMP/manifest-windows.json.sig"
          git -C rolling-site config user.name github-actions[bot]
          git -C rolling-site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C rolling-site add rolling
          if git -C rolling-site diff --cached --quiet; then
            echo "rolling publication is idempotent; no changes"
          else
            git -C rolling-site commit -m "publish rolling generation ${{ steps.generation.outputs.generation }}"
            git -C rolling-site push origin HEAD:gh-pages
          fi
      - name: Resolve exact committed ledger state
        id: ledger-state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ledger_sha="$(git -C rolling-site rev-parse HEAD)"
          remote_ledger_sha="$(git -C rolling-site ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          test -n "$remote_ledger_sha" || { echo "gh-pages ledger branch is missing after publication" >&2; exit 1; }
          test "$ledger_sha" = "$remote_ledger_sha" || {
            echo "local ledger commit $ledger_sha differs from remote gh-pages commit $remote_ledger_sha" >&2
            exit 1
          }
          echo "ledger_sha=$ledger_sha" >> "$GITHUB_OUTPUT"

  deploy-pages:
    needs: publish-ledger
    if: needs.publish-ledger.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Checkout exact committed ledger state
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-ledger.outputs.ledger_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: rolling-site
      - name: Prepare clean Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -d rolling-site/rolling || { echo "committed gh-pages ledger is missing rolling/" >&2; exit 1; }
          mkdir -p pages-root
          cp -R rolling-site/rolling pages-root/rolling
          test -f pages-root/rolling/generations/index.json
          generation_dir="$(find pages-root/rolling/generations -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$generation_dir" || { echo "Pages artifact is missing immutable generation history" >&2; exit 1; }
          for platform in windows linux; do
            test -f "pages-root/rolling/$platform/manifest.json"
            test -f "pages-root/rolling/$platform/manifest.json.sig"
          done
          test ! -e pages-root/rolling/.git || { echo "Pages artifact must not contain .git" >&2; exit 1; }
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
