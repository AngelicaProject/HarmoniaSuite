name: Production release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable product release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-release:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-tag.outputs.release_tag }}
    steps:
      - name: Validate release tag input
        id: release-tag
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG_INPUT"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be vX.Y.Z: ${tag:-<missing>}" >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  verify-and-build:
    name: Build ${{ matrix.platform }} x64
    needs: resolve-release
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure deterministic Git line endings
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact release commit
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$release_commit" = "$tag_commit"
          echo "release checkout: $RELEASE_TAG @ $release_commit"
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json
      - name: Check product version contract and release tag
        shell: bash
        run: |
          set -euo pipefail
          node tools/version/check-versions.mjs
          node tools/release/check-release.mjs "$RELEASE_TAG"
      - name: Embed immutable release bootstrap seed
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$release_commit" = "$tag_commit"
          echo "HARMONIA_RELEASE_SEED_COMMIT=$release_commit" >> "$GITHUB_ENV"
          echo "HARMONIA_RELEASE_PRODUCT_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify frontend
        run: npm ci
        working-directory: frontend
      - name: Check frontend
        run: npm run check
        working-directory: frontend
      - name: Package desktop payload
        run: npm ci
        working-directory: apps/desktop
      - name: Check desktop
        run: npm run check
        working-directory: apps/desktop
      - name: Package desktop
        run: npm run package
        working-directory: apps/desktop
      - name: Verify Windows desktop icon resource
        if: runner.os == 'Windows'
        run: node tools/release/verify-windows-icon.mjs apps/desktop/artifacts/windows-x64/HarmoniaSuite.exe assets/branding/harmonia-suite.ico
      - name: Build backend with checksum-protected Maven Wrapper
        if: runner.os != 'Windows'
        run: ./mvnw -B -q -DskipTests package
      - name: Build backend with checksum-protected Maven Wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B -q -DskipTests package
      - name: Rust format, lint and tests
        run: |
          cargo fmt --manifest-path apps/installer/Cargo.toml -- --check
          cargo clippy --manifest-path apps/installer/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path apps/installer/Cargo.toml
      - name: Build installer
        run: cargo build --manifest-path apps/installer/Cargo.toml --release --bins
      - name: Verify Windows installer icon resource
        if: runner.os == 'Windows'
        run: node tools/release/verify-windows-icon.mjs apps/installer/target/release/HarmoniaSetup.exe assets/branding/harmonia-suite.ico
      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_B64: ${{ secrets.HARMONIA_WINDOWS_SIGNING_CERTIFICATE_B64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.HARMONIA_WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_B64) -and -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PASSWORD)) {
            $certificate = Join-Path $env:RUNNER_TEMP "harmonia-release.pfx"
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_B64))
            signtool sign /fd sha256 /f $certificate /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td sha256 apps/installer/target/release/HarmoniaSetup.exe
            signtool verify /pa apps/installer/target/release/HarmoniaSetup.exe
            "authenticode=signed" | Set-Content (Join-Path $env:RUNNER_TEMP "windows-signing.txt")
          } else {
            Write-Warning "Authenticode credentials are absent; release binaries remain unsigned."
            "authenticode=unsigned" | Set-Content (Join-Path $env:RUNNER_TEMP "windows-signing.txt")
          }
      - name: Stage release files (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          install -m 0755 apps/installer/target/release/harmonia-setup release/harmonia-setup
          (
            cd release
            sha256sum harmonia-setup > sha256sums-linux.txt
          )
      - name: Stage release files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item apps/installer/target/release/HarmoniaSetup.exe release/HarmoniaSetup.exe
          Copy-Item (Join-Path $env:RUNNER_TEMP "windows-signing.txt") release/windows-signing.txt
          Get-FileHash release/HarmoniaSetup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower()) *$($_.Path | Split-Path -Leaf)" } | Set-Content release/sha256sums-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release
          if-no-files-found: error

  publish:
    name: Publish HarmoniaSuite product release
    needs: [resolve-release, verify-and-build]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - name: Verify release contract and create metadata
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$release_commit" = "$tag_commit"
          node tools/release/check-release.mjs "$RELEASE_TAG"
          mkdir -p release-input/release-metadata
          node tools/release/create-release-metadata.mjs --commit "$release_commit" --out release-input/release-metadata/release-metadata.json
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-input
          merge-multiple: false
      - name: Publish exact assets or verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          repo="$GITHUB_REPOSITORY"
          for sums in release-input/release-*/sha256sums-*.txt; do
            (cd "$(dirname "$sums")" && sha256sum -c "$(basename "$sums")")
          done
          if release_json="$(gh release view "$tag" --repo "$repo" --json isDraft 2>/dev/null)"; then
            is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          else
            gh release create "$tag" --repo "$repo" --draft \
              --title "HarmoniaSuite $tag" \
              --notes "HarmoniaSuite product release for Windows/Linux x64. Rolling main updates are published separately."
            is_draft=true
          fi

          if [[ "$is_draft" != "true" ]]; then
            existing="$RUNNER_TEMP/existing-release"
            expected="$RUNNER_TEMP/expected-release"
            rm -rf "$existing" "$expected"
            mkdir -p "$existing" "$expected"
            gh release download "$tag" --repo "$repo" --dir "$existing"
            while IFS= read -r -d '' file; do
              name="$(basename "$file")"
              destination="$expected/$name"
              if [[ -e "$destination" ]] && ! cmp -s "$file" "$destination"; then
                echo "expected asset basename collision: $name" >&2
                exit 1
              fi
              cp "$file" "$destination"
            done < <(find release-input -type f -print0)
            while IFS= read -r -d '' file; do
              name="$(basename "$file")"
              [[ -f "$expected/$name" ]] || { echo "published release has unexpected asset: $name" >&2; exit 1; }
              cmp -s "$file" "$expected/$name" || { echo "published release asset differs: $name" >&2; exit 1; }
            done < <(find "$existing" -type f -print0)
            while IFS= read -r -d '' file; do
              name="$(basename "$file")"
              [[ -f "$existing/$name" ]] || { echo "published release is missing asset: $name" >&2; exit 1; }
              cmp -s "$file" "$existing/$name" || { echo "published release asset differs: $name" >&2; exit 1; }
            done < <(find "$expected" -type f -print0)
            echo "tagged release $tag is already published and matches expected assets; no-op"
            exit 0
          fi

          while IFS= read -r -d '' file; do
            gh release upload "$tag" --repo "$repo" "$file" --clobber
          done < <(find release-input -type f -print0)
          gh release edit "$tag" --repo "$repo" --draft=false
