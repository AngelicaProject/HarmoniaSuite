name: Production release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Build ${{ matrix.platform }} x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json
      - name: Verify frontend
        run: npm ci
        working-directory: frontend
      - name: Check frontend
        run: npm run check
        working-directory: frontend
      - name: Package desktop payload
        run: npm ci
        working-directory: apps/desktop
      - name: Check desktop
        run: npm run check
        working-directory: apps/desktop
      - name: Package desktop
        run: npm run package
        working-directory: apps/desktop
      - name: Build backend with checksum-protected Maven Wrapper
        if: runner.os != 'Windows'
        run: ./mvnw -B -q -DskipTests package
      - name: Build backend with checksum-protected Maven Wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B -q -DskipTests package
      - name: Rust format, lint and tests
        run: |
          cargo fmt --manifest-path apps/installer/Cargo.toml -- --check
          cargo clippy --manifest-path apps/installer/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path apps/installer/Cargo.toml
      - name: Build installer and stable launcher
        run: cargo build --manifest-path apps/installer/Cargo.toml --release --bins
      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_B64: ${{ secrets.HARMONIA_WINDOWS_SIGNING_CERTIFICATE_B64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.HARMONIA_WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_B64) -and -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PASSWORD)) {
            $certificate = Join-Path $env:RUNNER_TEMP "harmonia-release.pfx"
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_B64))
            signtool sign /fd sha256 /f $certificate /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td sha256 target/release/HarmoniaSetup.exe
            signtool sign /fd sha256 /f $certificate /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td sha256 target/release/HarmoniaSuite.exe
            signtool verify /pa target/release/HarmoniaSetup.exe
            signtool verify /pa target/release/HarmoniaSuite.exe
            "authenticode=signed" | Set-Content (Join-Path $env:RUNNER_TEMP "windows-signing.txt")
          } else {
            Write-Warning "Authenticode credentials are absent; release binaries remain unsigned."
            "authenticode=unsigned" | Set-Content (Join-Path $env:RUNNER_TEMP "windows-signing.txt")
          }
      - name: Stage release files (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          install -m 0755 target/release/harmonia-setup release/harmonia-setup
          install -m 0755 target/release/harmonia-suite release/harmonia-suite
          sha256sum release/harmonia-setup release/harmonia-suite > release/sha256sums-linux.txt
      - name: Stage release files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/release/HarmoniaSetup.exe release/HarmoniaSetup.exe
          Copy-Item target/release/HarmoniaSuite.exe release/HarmoniaSuite.exe
          Copy-Item (Join-Path $env:RUNNER_TEMP "windows-signing.txt") release/windows-signing.txt
          Get-FileHash release/HarmoniaSetup.exe, release/HarmoniaSuite.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower()) *$($_.Path | Split-Path -Leaf)" } | Set-Content release/sha256sums-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release
          if-no-files-found: error

  publish:
    name: Publish tagged distribution
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-input
          merge-multiple: false
      - name: Reuse or create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "HarmoniaSuite $GITHUB_REF_NAME" --notes "Tagged HarmoniaSuite Windows/Linux x64 distribution. Rolling main updates are published separately."
          fi
      - name: Upload exact assets and publish after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for sums in release-input/release-*/sha256sums-*.txt; do
            (cd "$(dirname "$sums")" && sha256sum -c "$(basename "$sums")")
          done
          while IFS= read -r -d '' file; do
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          done < <(find release-input -type f -print0)
          gh release edit "$GITHUB_REF_NAME" --draft=false
