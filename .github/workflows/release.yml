name: Release

on:
  push:
    tags: ['v*']

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AngelicaProject/HarmoniaExtractor
          path: extractor
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish XivExdUnpacker.csproj -c Release -r win-x64 --self-contained -o ../bundle/unpacker
        working-directory: extractor
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Fetch toolchain
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force toolchain-dl | Out-Null
          Invoke-WebRequest -Uri 'https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jdk/hotspot/normal/eclipse' -OutFile toolchain-dl/jdk.zip
          $mingit = gh release view -R git-for-windows/git --json assets -q '.assets[].name' | Where-Object { $_ -like 'MinGit-*-64-bit.zip' -and $_ -notlike '*busybox*' } | Select-Object -First 1
          gh release download -R git-for-windows/git -p $mingit -D toolchain-dl
          New-Item -ItemType Directory -Force staging/toolchain/jdk, staging/toolchain/git | Out-Null
          Expand-Archive toolchain-dl/jdk.zip staging/toolchain/jdk
          Expand-Archive "toolchain-dl/$mingit" staging/toolchain/git
      - name: Ensure WiX
        shell: pwsh
        run: |
          if (-not (Get-Command light.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y
            "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - run: mvn -B -q -DskipTests package "-Dapp.commit=$env:GITHUB_SHA"
        working-directory: app
      - name: Stage jpackage input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging, staging/unpacker, staging/src | Out-Null
          Copy-Item app/target/harmonia-suite.jar staging/
          Copy-Item bundle/unpacker/XivExdUnpacker.exe staging/unpacker/
          "version=$env:GITHUB_REF_NAME" | Out-File -Encoding utf8 staging/VERSION.txt
          "commit=$env:GITHUB_SHA" | Out-File -Encoding utf8 -Append staging/VERSION.txt
          git -C app archive HEAD | tar -x -C staging/src
          Copy-Item -Recurse -Force app/.git staging/src/.git
          git -C staging/src config --unset-all http.https://github.com/.extraheader 2>$null; $LASTEXITCODE = 0
      - name: Build MSI
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          jpackage --type msi --dest installer --name HarmoniaSuite --vendor AngelicaProject `
            --app-version $tag --win-per-user-install --win-shortcut --win-menu --win-menu-group AngelicaProject `
            --java-options "-Djava.awt.headless=false" `
            --icon app/src/main/dist/yuki.ico --input staging --main-jar harmonia-suite.jar
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.msi
            app/target/harmonia-suite-*.zip
          generate_release_notes: true
