name: Production release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Build ${{ matrix.platform }} x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json
      - name: Verify frontend
        run: npm ci
        working-directory: frontend
      - name: Check frontend
        run: npm run check
        working-directory: frontend
      - name: Package desktop payload
        run: npm ci
        working-directory: apps/desktop
      - name: Check desktop
        run: npm run check
        working-directory: apps/desktop
      - name: Package desktop
        run: npm run package
        working-directory: apps/desktop
      - name: Build backend with checksum-protected Maven Wrapper
        if: runner.os != 'Windows'
        run: ./mvnw -B -q -DskipTests package
      - name: Build backend with checksum-protected Maven Wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B -q -DskipTests package
      - name: Rust format, lint and tests
        run: |
          cargo fmt --manifest-path apps/installer/Cargo.toml -- --check
          cargo clippy --manifest-path apps/installer/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path apps/installer/Cargo.toml
      - name: Build installer and stable launcher
        run: cargo build --manifest-path apps/installer/Cargo.toml --release --bins
      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_B64: ${{ secrets.HARMONIA_WINDOWS_SIGNING_CERTIFICATE_B64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.HARMONIA_WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_B64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PASSWORD)) { throw "Windows signing credentials are required; refusing unsigned release" }
          $certificate = Join-Path $env:RUNNER_TEMP "harmonia-release.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_B64))
          signtool sign /fd sha256 /f $certificate /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td sha256 target/release/HarmoniaSetup.exe
          signtool sign /fd sha256 /f $certificate /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td sha256 target/release/HarmoniaSuite.exe
          signtool verify /pa target/release/HarmoniaSetup.exe
          signtool verify /pa target/release/HarmoniaSuite.exe
      - name: Stage release files (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          install -m 0755 target/release/harmonia-setup release/harmonia-setup
          install -m 0755 target/release/harmonia-suite release/harmonia-suite
          sha256sum release/harmonia-setup release/harmonia-suite > release/sha256sums-linux.txt
      - name: Stage release files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/release/HarmoniaSetup.exe release/HarmoniaSetup.exe
          Copy-Item target/release/HarmoniaSuite.exe release/HarmoniaSuite.exe
          Get-FileHash release/HarmoniaSetup.exe, release/HarmoniaSuite.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower()) *$($_.Path | Split-Path -Leaf)" } | Set-Content release/sha256sums-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release
          if-no-files-found: error

  publish:
    name: Publish signed manifest
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-input
          merge-multiple: false
      - name: Require release signing secrets
        env:
          MANIFEST_KEY: ${{ secrets.HARMONIA_MANIFEST_SIGNING_KEY_PEM }}
          PUBLIC_KEY: ${{ secrets.HARMONIA_MANIFEST_PUBLIC_KEY_HEX }}
        run: |
          test -n "$MANIFEST_KEY" || { echo "manifest signing key is not configured" >&2; exit 1; }
          test "$PUBLIC_KEY" = "ee7809268d92d5a832ae8fb03f7d090123073a4833cb7f1f725babfe74ff1925" || { echo "production public key secret does not match installer trust root" >&2; exit 1; }
      - name: Create draft release and publish binaries first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "HarmoniaSuite $GITHUB_REF_NAME" --notes "Production Windows/Linux x64 release."
          find release-input -type f -not -name 'sha256sums-*.txt' -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME"
          find release-input -name 'sha256sums-*.txt' -print0 | xargs -0 -I{} gh release upload "$GITHUB_REF_NAME" "{}"
      - name: Generate, sign and verify platform manifests
        env:
          MANIFEST_KEY: ${{ secrets.HARMONIA_MANIFEST_SIGNING_KEY_PEM }}
          PUBLIC_KEY: ${{ secrets.HARMONIA_MANIFEST_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/harmonia-manifest-key.pem"
          printf '%s\n' "$MANIFEST_KEY" > "$key"
          version="${GITHUB_REF_NAME#v}"
          for platform in linux windows; do
            node tools/release/create-manifest.mjs --platform "$platform" --target-commit "$GITHUB_SHA" --product-version "$version" --generation "$GITHUB_RUN_NUMBER" --out "release-input/manifest-$platform.json"
            HARMONIA_MANIFEST_SIGNING_KEY_FILE="$key" node tools/release/sign-manifest.mjs "release-input/manifest-$platform.json" "release-input/manifest-$platform.json.sig" primary-2026
            HARMONIA_MANIFEST_PUBLIC_KEY_HEX="$PUBLIC_KEY" node tools/release/verify-manifest.mjs "release-input/manifest-$platform.json" "release-input/manifest-$platform.json.sig"
          done
      - name: Publish manifests only after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-input/manifest-linux.json release-input/manifest-linux.json.sig release-input/manifest-windows.json release-input/manifest-windows.json.sig
