name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      # The Maven wrapper distribution is intentionally checksum-pinned and may not
      # be present in the runner cache. Use the runner's preinstalled Maven only
      # for CodeQL's traced compilation; production builds still use ./mvnw.
      - name: Build Java for CodeQL
        run: mvn -B -q -DskipTests package
      - uses: github/codeql-action/analyze@v3
