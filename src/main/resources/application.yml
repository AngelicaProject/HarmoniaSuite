server:
  port: 8765
  address: 127.0.0.1
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: harmonia-suite
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      indent-output: false

harmonia:
  workspace: .
  core:
    db-path: data/core/harmonia.db
    postgres-schema: harmonia_core
  app:
    version: '@project.version@'
    build-time: '@maven.build.timestamp@'
    commit: '@app.commit@'
  http:
    connect-timeout-ms: 15000
    read-timeout-ms: 300000
  source-ingestion:
    staging-path: data/source-staging
    artifact-path: data/source-artifacts
    max-upload-bytes: 4294967296
    max-hxs-bytes: 4294967296
    max-chunk-bytes: 16777216
    stale-upload-hours: 24
    zstd-level: 3
  atlas:
    executable: ${HARMONIA_ATLAS_EXECUTABLE:}
    verification-timeout-ms: 300000
    max-stdout-bytes: 1048576
    max-stderr-bytes: 65536

logging:
  level:
    com.harmoniasuite: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10
      total-size-cap: 100MB
